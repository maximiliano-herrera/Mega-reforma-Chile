project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
    - 01_empleo_publico.qmd
    - 02_salud_fonasa.qmd
    - 03_tributacion.qmd
    - 04_empleo_formal.qmd
    - 05_finanzas_publicas.qmd
    - 06_vivienda.qmd
    - 07_inversion.qmd
    - metodologia.qmd
    - acerca.qmd
    - glosario.qmd
  resources:
    - "*.R"
    - datos/**
    - scripts/*.R
    - fuentes/manifest.csv
    - 07_inversion/impuesto_corporativo_fbcf.xlsx
website:
  title: "Política para no políticos"
  site-url: https://maximiliano-herrera.github.io/Mega-reforma-Chile/
  navbar:
    background: "#1a365d"
    left:
      - text: Inicio
        href: index.qmd
      - text: Análisis del plan
        menu:
          - text: Tributación
            href: 03_tributacion.qmd
          - text: Empleo
            href: 04_empleo_formal.qmd
          - text: Finanzas públicas
            href: 05_finanzas_publicas.qmd
          - text: Vivienda
            href: 06_vivienda.qmd
          - text: Inversión
            href: 07_inversion.qmd
      - text: Capacidad estatal
        href: 01_empleo_publico.qmd
      - text: Salud
        href: 02_salud_fonasa.qmd
      - text: Método y fuentes
        menu:
          - text: Metodología y fuentes
            href: metodologia.qmd
          - text: Glosario
            href: glosario.qmd
          - text: Acerca del proyecto
            href: acerca.qmd
  page-footer:
    left: "Un proyecto de [Maximiliano Herrera](acerca.qmd) · análisis reproducible con R y Quarto"
    center: "[GitHub](https://github.com/maximiliano-herrera/Mega-reforma-Chile) · [LinkedIn](https://www.linkedin.com/in/maximiliano-herrera-1380661ba/) · [Glosario](glosario.qmd) · [Volver a la portada](index.qmd)"
    right: "Versión analizada: anuncios de marzo y abril de 2026 · última revisión: 18 de octubre de 2026"
format:
  html:
    theme: flatly
    lang: es
    toc: true
    toc-title: En esta página
    css: styles.css
    code-fold: true
    code-summary: Ver código R
    fig-width: 8
    fig-height: 4.8
    fig-dpi: 160
    link-external-newwindow: true
execute:
  echo: true
  warning: false
  message: false
  cache: false
